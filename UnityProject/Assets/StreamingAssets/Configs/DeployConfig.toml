# 运行时部署覆盖配置。字段为空或解析失败时，会回退到 UpdateSetting 的默认值。

# 主资源服务器根地址。运行时会继续拼接项目名和平台名。
ResDownloadPath = "http://127.0.0.1:80/ProjectHotupdate"

# 备用资源服务器根地址。主地址不可用时使用。
FallbackResDownloadPath = "http://127.0.0.1:80/ProjectHotupdate"

# 调试器激活策略：
# AlwaysOpen / OnlyOpenWhenDevelopment / OnlyOpenInEditor / AlwaysClose / HotkeyToggle
DebuggerActiveWindow = "AlwaysOpen"

# 资源初始化模式覆盖（仅 Windows/OSX/Linux 桌面平台且非编辑器时生效，其他平台忽略）：
# Offline = 单机内置模式 / Host = 联机热更模式。
# 留空时使用打包内置模式（UpdateSetting / ResourceModuleDriver 配置）。
YooPlayMode = ""
