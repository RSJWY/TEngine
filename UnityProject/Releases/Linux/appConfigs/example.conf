# debkit 应用配置示例
#
# 复制一份改名成你自己的配置，例如 appConfigs/myapp.conf，然后：
#   ./debkit.sh -c appConfigs/myapp.conf
#
# 相对路径说明：
#   - SRC_DIR 建议写绝对路径（WSL 下就是 /mnt/<盘符>/...）
#   - LOGO 相对于 SRC_DIR 解析，可以用 ../ 引用构建产物之外的图
# 也可以什么都不写，直接 ./debkit.sh 走交互式向导生成一份。

# 显示名（会出现在桌面图标下，可中文）
APP_TITLE="My Application"
# Debian 包名：全小写，只能含 a-z 0-9 + - .，也是启动命令名
PKG_NAME="my-application"
VERSION="1.0.0"
REVISION="1"
# 维护人必须是 name <email> 形式
MAINTAINER="Your Name <you@example.com>"
# 内网部署没有主页就留空，留空时 control 里不输出 Homepage 字段
HOMEPAGE=""
SECTION="misc"
PRIORITY="optional"
# x86_64 对应 amd64；arm64 机器请改成 arm64 并确认程序本体是 arm64 编译的
ARCH="amd64"
DESC_SHORT="一句话简介"
DESC_LONG="详细说明，可以多行。
空行会被转换成 Debian 描述格式里的 ' .'

本包提供:
 * 桌面快捷方式与开始菜单入口
 * 可开关的开机自动启动
 * 一键切换自启动的控制命令"

# ---------------------------------------------------------------------------
# 程序产物
# ---------------------------------------------------------------------------
# Unity 侧默认输出在 Releases/Linux/build/（Linux 构建的 player 目录）。
# WSL 示例：/mnt/e/Unity/TEngine/UnityProject/Releases/Linux/build
SRC_DIR="/path/to/your/linux/build"
# 目录里的主可执行文件名。首次构建后先 ls 确认实际名字再填，否则会直接报错退出。
EXECUTABLE="MyApplication.x86_64"
# 图标源图：相对 SRC_DIR 或绝对路径。方形、四角纯白底的图效果最好（会自动去白底）。
LOGO="logo.jpg"
INSTALL_DIR="/opt/my-application"
CATEGORIES="Utility;"
GENERIC_NAME="My Application"
KEYWORDS="keyword1;keyword2;"
# 四个入口（桌面 / 菜单 / 自启 / 终端）共用的默认启动参数，留空 = 不附加。
# 例：EXTRA_ARGS="-screen-fullscreen 1"
EXTRA_ARGS=""

# ---------------------------------------------------------------------------
# 运行时开关（可选，写进 /etc/<包名>/ 下，启动器每次启动读取）
# ---------------------------------------------------------------------------
# 默认画质档位：只接受数字索引（0 起，顺序同 Unity Project Settings > Quality）。
# none = 不生成 quality 文件，由程序自己决定。
# 需要主程序解析 -picture-quality <索引>（本仓库 ProcedureLaunch 已实现）。
QUALITY_DEFAULT="none"
# 默认图形接口：opengl（-force-glcore）/ vulkan（-force-vulkan）/ none（由 Unity 自己挑）。
GRAPHICS_DEFAULT="none"

# ---------------------------------------------------------------------------
# 开机自启 / 桌面图标
# ---------------------------------------------------------------------------
AUTOSTART_DEFAULT="yes"
# 大体积 Unity 程序在登录后桌面还在加载，延后几秒再拉起来更稳
AUTOSTART_DELAY="3"
# 装包时是否给现有本地用户自动创建桌面快捷方式；no 时用户仍可手动执行
#   <包名>-ctl icon create
CREATE_DESKTOP_ICON="yes"

# ---------------------------------------------------------------------------
# 依赖与打包
# ---------------------------------------------------------------------------
# | 表示二选一。t64 后缀是 Ubuntu 24.04 的包名，老系统会自动选不带后缀的那个。
DEPENDS="libc6, libstdc++6, libgl1 | libgl1-mesa-glx, libglu1-mesa | libglu1, libx11-6, libxext6, libxfixes3, libxcursor1, libxrandr2, libxinerama1, libxi6, libasound2 | libasound2t64, libpulse0, libgtk-3-0 | libgtk-3-0t64"
# auto = 按 pigz → zstd → gzip → xz 挑第一个可用的；
# pigz 输出仍是标准 gzip 流，兼容性同 gzip，但能吃满多核（大包快一个数量级）。
# zstd 需要 dpkg ≥ 1.21，老系统上写 zstd 会自动降级。
COMPRESS="auto"
COMPRESS_LEVEL="6"
# 要从包里剔除的通配符，空格分隔，例："*.pdb *.log"
EXCLUDE=""
